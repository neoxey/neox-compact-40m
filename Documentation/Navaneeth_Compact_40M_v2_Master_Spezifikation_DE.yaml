      Diese Befestigerangaben sind ein Ausgangsregister und müssen auf Vollständigkeit,
      tatsächliche Lochgeometrie, Gewindeeingriff, Montagezugang, Festigkeitsklasse und
      Kollisionsfreiheit geprüft werden. Die ursprüngliche Stückzahlbeschreibung ist nicht
      als vollständige Fertigungsstückliste zu behandeln.

  v2_0_aenderungsvorschlaege_aus_baseline:
    status: "Vorgeschlagene Korrekturen; vor Übernahme rechnerisch und konstruktiv prüfen."
    - id: "REV-01"
      thema: "Umreifungszugang"
      vorschlag: "3 radiale Schlitze mit 16 mm Breite bei 0°, 120°, 240° in beiden Flanschen, radial von R=110 bis R=46; passende Trommelkanäle 16 mm breit und 6 mm tief."
      pruefung: "Festigkeit der Flansche und Trommel, Bandkontakt, Gurtzugang, Kantenradien und Entnahme prüfen."
    - id: "REV-02"
      thema: "Kragarm-Führungsachse"
      vorschlag: "Führungsachse auf Ø16 mm erhöhen; Führungsarmdicke auf 8 mm erhöhen; zwei 6002-2RS-Lager in der Führungsrolle prüfen."
      pruefung: "Biegung, Lagerabstand, Wellenlagerung, Masse und tatsächliche Montage prüfen."
    - id: "REV-03"
      thema: "Spindel und Drehmomentverbindung"
      vorschlag: "Wellen-/Lagersitz Ø17,00 mm, Nabenbohrung Ø17,05 mm; Querschraube M6 oder 6-mm-Feder-/Passstift bei X=-9 mm erwägen."
      pruefung: "Passungen, Querschnittsschwächung, Scherung, Ermüdung, Demontage und Drehmomentkapazität berechnen."
    - id: "REV-04"
      thema: "Reaktionsmoment am Bohrschrauber"
      vorschlag: "Am Rahmen befestigte, geeignete Halterung für den Bohrschraubergriff."
      pruefung: "Reaktionsmoment, sichere Befestigung, Triggerzugang, Akkuwechsel und unbeabsichtigtes Anlaufen prüfen."
    - id: "REV-05"
      thema: "Bodenfreiheit"
      vorschlag: "Keine freiliegenden Muttern oder Schrauben, die fast auf Bodenniveau liegen; Befestigungsrichtung ändern oder geeignete Rahmenverbindung einsetzen."
      pruefung: "Bodenfreiheit, Wartung, Montage und Festigkeit prüfen."
    - id: "REV-06"
      thema: "Bandführung"
      vorschlag: "Drei Führungskragen oder ein Vierpositionsschieber an Bandmitten X=19, 45, 71, 97 mm erwägen."
      pruefung: "Nur anwenden, wenn eine einzelne Bandbahn oder eine validierte Traverse diese Positionen sinnvoll nutzt. Mit 25-mm-Bandbreite und Trommelbreite abgleichen."
    - id: "REV-07"
      thema: "Ventilgriff-Stiel"
      vorschlag: "Ursprüngliche 2-mm-Lücke durch einen Stiel mit Radius 4 mm von Z=28 bis Z=32 schließen."
      pruefung: "Nur relevant, falls diese Platzhaltergeometrie im finalen Ventilmodell beibehalten wird."

  rechenmodelle:
    urspruengliche_gleichungen:
      trommelbreite: "W_drum = N_bands * W_tape + (N_bands - 1) * 1,0 + 7,0"
      rollenradius: "R_coil = sqrt(R_core^2 + (L_tape * t_tape) / (pi * N_bands * eta))"
      flanschdurchmesser: "D_flange = 2 * (R_coil + 13,0)"
      spindelmittenhoehe: "Z_c = D_flange / 2 + 40,0"
      parameter:
        bandbreite_mm: 25.0
        effektive_staerke_mm: 1.5
        bandlaenge_mm: 40000
        packungsfaktor: 0.70
        urspruengliche_bahnanzahl: 4
        kernradius_mm: 50.0
    pflicht:
      - "Gleichungen mit Einheiten prüfen."
      - "Wickelkapazität für eine einzelne durchgehende Bandbahn neu berechnen."
      - "Effektive Bandstärke und Packungsfaktor anhand realer Messungen oder klar gekennzeichneter Annahmen begründen."
      - "Konischen Kern, variable Radien, nutzbare Breite, Flanschfreiraum und Strapping-Geometrie berücksichtigen."
      - "Drehzahl-/Zeitmodell mit wachsendem Wickelradius berechnen."
      - "Bandzug und Drehmoment nicht ohne Messwerte oder begründete konservative Annahmen festlegen."
      - "Ergebnisse in Excel mit Formeln und Einheiten offenlegen."

  geforderte_artefakte:
    1_html_projektseite:
      datei: "Navaneeth_Compact_40M_Project.html"
      inhalt:
        - "Projektübersicht, Anforderungen, technische Daten und offene Risiken"
        - "Navigierbare Baugruppen- und Komponentenliste"
        - "Verlinkte Zeichnungen und Berechnungen"
    2_pdf_ingenieurbericht:
