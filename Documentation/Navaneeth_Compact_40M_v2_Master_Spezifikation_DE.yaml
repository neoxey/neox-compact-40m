        - "Alle Ausgangsmaße und Koordinaten"
        - "Änderungsprotokoll"
        - "Geometrie- und Kapazitätsberechnungen"
        - "Spindel-, Lager-, Antriebs- und Rahmenauslegung"
        - "Bandweg und Ventilanschluss"
        - "Umreifung und Rollenentnahme"
        - "BOM, Fastener-Register und Massenbudget"
        - "Montage- und Wartungsanleitung"
        - "Validierungsstatus und offene Risiken"
    3_excel:
      datei: "Navaneeth_Compact_40M_Calculations_BOM_DE.xlsx"
      tabellenblaetter:
        - "Parameter_und_Einheiten"
        - "Geometrie"
