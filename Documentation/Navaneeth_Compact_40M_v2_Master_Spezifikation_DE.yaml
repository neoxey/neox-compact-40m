  phasenplan:
    - phase: 1
      name: "ZIP- und Quellcode-Audit"
      ergebnis: "Dateiinventar, Geometrieaudit, Liste widersprüchlicher Maße"
    - phase: 2
      name: "Parameter- und Anforderungsbaseline"
      ergebnis: "Eindeutige Maße, offene Annahmen und freigegebene Berechnungsparameter"
    - phase: 3
      name: "Mechanische Validierung"
      ergebnis: "Nachvollziehbare Wickel-, Wellen-, Lager-, Antriebs-, Rahmen- und Bandweg-Berechnungen"
    - phase: 4
      name: "Detaillierte parametrische CAD-Konstruktion"
      ergebnis: "Jedes Teil, jedes Loch, jeder Befestiger und jede Verbindung modelliert"
    - phase: 5
      name: "Baugruppen und Zeichnungen"
      ergebnis: "Montierte Baugruppe, Unterbaugruppen, Explosionsansichten, bemaßte Zeichnungen"
    - phase: 6
      name: "Dokumentation und Berechnungsdateien"
      ergebnis: "HTML-Projektseite, PDF-Bericht, Excel-Berechnungen und BOM"
    - phase: 7
      name: "Interaktiver CAD-Viewer"
      ergebnis: "Echte Komponentenwahl, Animationen, Explosionsansicht und Bauteilinformationen"
    - phase: 8
      name: "Prüfung und Paketierung"
      ergebnis: "Konsistentes ZIP, Geometriechecks, Dateiinventar und dokumentierter Freigabestatus"

  freigabekriterien:
    - "Jedes Teil hat eine eindeutige ID und einen definierten Transform."
    - "Jeder Befestiger im Modell ist im Befestigerregister enthalten und umgekehrt."
    - "Alle Befestiger fluchten mit ihren Bohrungen und haben Montagezugang."
    - "Lager, Wellen und Gehäuse haben kompatible, herstellerbasierte Maße und Passungen."
    - "Keine unbeabsichtigten Kollisionen; bewegte Teile besitzen notwendige Freiräume."
    - "Die Trommel kann sich drehen und die vordere Flanscheinheit lässt sich entfernen."
    - "Die umreifte Rolle hat einen freien Entnahmepfad."
    - "Der stationäre Ventilanschluss bleibt beim Wickeln unbelastet und angeschlossen."
    - "Der Bohrschrauber ist gegen Reaktionsmoment gesichert."
    - "Massenbudget enthält alle benötigten Komponenten."
    - "BOM, CAD-Baugruppe, GLB, STEP, STL und Zeichnungen gehören zur gleichen Revision."
    - "HTML-Schaltflächen und Auswahlfunktionen führen die dokumentierten Aktionen tatsächlich aus."
    - "Ungeklärte sicherheitskritische Punkte sind sichtbar und verhindern eine falsche Fertigungsfreigabe."
    - "CAD-Prüfungen, Berechnungen und physische Tests werden separat ausgewiesen."

  lieferbericht:
    erforderlich:
      - "Zusammenfassung der Änderungen gegenüber v1.0"
      - "Liste aller erzeugten Dateien"
      - "Komponenten- und Befestigeranzahl"
      - "Massenbudget mit Annahmen"
      - "Ergebnisse der CAD- und Konsistenzprüfungen"
      - "Offene Risiken und noch erforderliche physische Tests"
    schlussregel: >
      Nicht nur einen Plan oder einen schönen Render liefern. Die vorhandenen Quell- und Modelldateien
      tatsächlich überarbeiten und alle unterstützten Artefakte erzeugen. Wenn ein Format nicht
      erzeugt werden kann, die Einschränkung klar nennen. Keine mechanische oder physische Validierung
      behaupten, die nicht durchgeführt und dokumentiert wurde.
