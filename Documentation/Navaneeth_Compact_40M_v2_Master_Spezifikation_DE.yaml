projekt:
  name: "Navaneeth Compact 40M v2.0"
  dokumenttyp: "Deutsche Master-Spezifikation für CAD, Berechnungen, Dokumentation und Web-Viewer"
  revision: "0.1 – Planungsbasis"
  status: "Anforderungen erfasst; Geometrie und sicherheitskritische Funktionen noch zu validieren"
  zweck: >
    Dieses Dokument ist die verbindliche Arbeitsanweisung für einen deutschen KI-/CAD-Agenten.
    Es beschreibt die Maschine, die bekannten Ausgangsmaße, die offenen technischen Konflikte,
    die geforderten CAD- und Web-Artefakte sowie die Prüf- und Freigabekriterien.
    Es ist eine YAML-Datei, kein fertiger CAD-Datensatz und kein Nachweis einer bestandenen Prüfung.

  rollen_und_arbeitsweise:
    rolle: "Mechanischer Konstrukteur, CAD-Entwickler und Ersteller der Projektdokumentation"
    anweisungen:
      - "Das vorhandene ZIP-Paket und den vollständigen Quellcode zuerst prüfen."
      - "Bestehende brauchbare Arbeit weiterverwenden; nicht nur eine neue Visualisierung erzeugen."
      - "Alle Maße aus der Basisspezifikation übernehmen, sofern sie nicht als widersprüchlich oder ungeprüft markiert sind."
      - "Widersprüche ausdrücklich protokollieren und rechnerisch oder anhand realer Herstellerdaten auflösen."
      - "Keine unbekannten Maße, Drehmomente, Toleranzen, Materialwerte oder Prüfergebnisse erfinden."
      - "Annahmen, Berechnungen, CAD-Prüfungen und physische Tests klar voneinander unterscheiden."
      - "Technische Entscheidungen selbst treffen, begründen und im Änderungsprotokoll dokumentieren."
      - "Vor einer Fertigungsfreigabe sicherheitskritische Mechanik und tatsächliche Fertigbarkeit validieren."
      - "Keine Fertigungsreife behaupten, solange kritische Anforderungen ungeklärt sind."

  feste_anforderungen:
    maschinenzweck: "Eine einzelne, durchgehende Flach-Tropfleitung mit 40 m Länge aufwickeln."
    tropfband:
      produkt: "ALLWIN GOLD Flach-Tropfband"
      herstellerangabe_aus_ausgangsdokument: "Allwin Pipes, Vijayamangalam, Erode District, Tamil Nadu, Indien"
      nominaler_innendurchmesser_aufgeblasen_mm: 16.0
      liegebreite_mm: 25.0
      liegebreite_bereich_mm: [24.5, 25.5]
      effektive_doppelwandstaerke_mm: 1.5
      wandstaerke_einzelwand_mm: "ca. 0,6–0,8"
      emitter_erhebungen_gesamtbreite_mm: "ca. 2,2–3,0"
      laenge_mm: 40000
      minimaler_trockener_biegeradius_mm: 48.0
      packungsfaktor_urspruengliche_annahme: 0.70
      hinweis: "Alle Bandwerte vor Fertigungsfreigabe anhand des tatsächlich verwendeten Bandes bestätigen."
    ventilanschluss:
      pflicht: "Das ventilseitige Ende bleibt während des Wickelns angeschlossen und stationär."
      lastanforderung: "Wickel-, Fang- und Führungsbelastungen dürfen nicht auf den Ventilanschluss übertragen werden."
      drehung: "Das Band darf sich nicht unkontrolliert um Spindel, Halter oder Anschluss verdrillen."
      abnahme: "Der vollständige Bandweg und die Entnahme der gebündelten Rolle müssen geometrisch und funktional nachgewiesen werden."
    rollenentnahme:
      pflicht: "Die gewickelte Rolle muss vor dem Entfernen gesichert/umreift werden."
      pflicht_2: "Die umreifte Rolle muss ohne Abtrennen des ventilseitigen Bandendes vom Wickelkörper abgenommen werden können."
      schritte_aus_baseline:
        - "Sicherungspin in +Z herausziehen."
        - "Haltescheibe in +X abziehen."
        - "Vordere frei drehbare Schutzflansche in +X abziehen."
        - "Umreifte Rolle in +X vom konischen Wickelkörper abziehen."
      hinweis: "Diese Sequenz nur übernehmen, wenn die endgültige Geometrie sie tatsächlich ermöglicht."
    antrieb:
      werkzeug: "INGCO CIDLI12206, 12-V-Akku-Schlagbohrschrauber"
      spannung_v: 12
      drehzahl_leerlauf_niedrig_rpm_aus_bisheriger_angabe: 400
      drehzahl_leerlauf_hoch_rpm_aus_bisheriger_angabe: 1500
      maximales_drehmoment_nm_aus_bisheriger_angabe: 20
      warnung: "Diese Werte sind noch anhand des offiziellen Herstellerdatenblatts für die exakte Variante zu verifizieren. Leerlaufdrehzahl und maximales Drehmoment sind keine garantierten Betriebspunkte."
      ziel_wickelzeit_min: 3
      ziel_wickelzeit_max: 5
      freigabebedingung: "Zielzeit nur akzeptieren, wenn Drehzahl, Untersetzung, Bandzug, Wellenlasten und Schutzmaßnahmen validiert sind."
      erforderliche_merkmale:
        - "Positive, mechanisch belastbare Drehmomentübertragung"
        - "Berechnete Drehzahlreduzierung, falls erforderlich"
        - "Am Maschinenrahmen abgestützte Reaktionsmomentaufnahme"
        - "Sicher zugängliche Stoppmöglichkeit"
        - "Schutz vor unbeabsichtigtem Anlaufen und relevanten Quetschstellen"
    masse:
      ziel_kg: 5.0
      gilt_fuer: "Komplette Maschine ohne Bohrschrauber und Akku"
      bedingung: "Zielwert anhand einer vollständigen, materialbasierten Massenbilanz nachweisen; nicht als erreicht behaupten, bevor alle Komponenten enthalten sind."
    prioritaeten:
      - "Kompaktheit"
      - "Geringe Masse bei ausreichender Festigkeit"
      - "Sichere und zuverlässige Bedienung"
      - "40-m-Kapazität"
      - "Stationärer, angeschlossener Ventilanschluss"
      - "Sicher umreifte, abnehmbare Rolle"
      - "Einfache Fertigung und Wartung"

  koordinatensystem:
    einheiten: "mm"
    achsen:
      X: "Spindel-/Drehachse; Rückseite/Bohrschrauberseite = -X; Entnahmeseite = +X"
      Y: "Seitliche horizontale Achse; Ventilseite = -Y"
      Z: "Vertikal; +Z nach oben"
    bezugsebenen:
      boden: "Z = 0,0"
      spindelmittellinie: "Y = 0,0; Z = 150,0"
      vorderflaeche_hinterer_flansch: "X = 0,0"
    regel: "Alle Komponenten, Bohrungen, Befestiger und Verbindungen müssen in diesem System eindeutig positioniert sein. Änderungen sind zu dokumentieren."

